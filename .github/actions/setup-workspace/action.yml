name: Set up workspace
description: Install pnpm, Node and workspace dependencies, then build the shared packages.

inputs:
  build-deps:
    description: Build the shared packages. Skip it for jobs that only need node_modules.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: "24"
        cache: "pnpm"

    # Only the build produces tsbuildinfo, so a job that skips it would other-
    # wise race to save an empty cache under the shared key.
    - name: Cache tsbuildinfo
      if: inputs.build-deps == 'true'
      uses: actions/cache@v5
      with:
        path: |
          **/tsconfig.tsbuildinfo
        key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-tsbuildinfo-

    - name: Install pnpm dependencies
      run: pnpm install
      shell: bash

    - name: Build dependencies
      if: inputs.build-deps == 'true'
      run: pnpm build:deps
      shell: bash
      env:
        CI: true
