name: Script CDN upload

# Uploads the script tag bundles for the SDK version on main to its own path on
# our CDN: /script/<version>/. That path never changes once it is uploaded.
#
# This does not change what sites load from /script/v<major>/. The "Script CDN
# promote" workflow does that.
on:
  push:
    branches:
      - main
    # The SDK version lives here, so this runs when a version bump is merged
    paths:
      - "packages/sdk-js/package.json"
  workflow_dispatch:

concurrency:
  group: script-cdn-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    # Only main: a version can't be replaced, so it must not come from a branch
    if: ${{ github.repository == 'growthbook/growthbook' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          build-deps: "false"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build and upload
        env:
          SCRIPT_CDN_BUCKET: ${{ vars.SCRIPT_CDN_BUCKET }}
        run: bash packages/sdk-js/scripts/script-cdn.sh upload
