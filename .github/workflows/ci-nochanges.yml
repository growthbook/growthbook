name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "eslint.config.mjs"
      - "eslint-rules/**"
      - "eslint-suppressions.json"
      - ".github/workflows/ci.yml"
      - ".github/actions/setup-workspace/**"
  pull_request:
    paths-ignore:
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "eslint.config.mjs"
      - "eslint-rules/**"
      - "eslint-suppressions.json"
      - ".github/workflows/ci.yml"
      - ".github/actions/setup-workspace/**"

# When code or tooling has not changed, skip the full CI suite but still check formatting.
# This workflow provides the required successful CI check for those pull requests.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install --ignore-scripts

      - name: Check formatting
        run: pnpm pretty:check
