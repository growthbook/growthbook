name: Build image

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build, tagged git-<sha> on Docker Hub unless release is set
        type: string
        required: true
      deploy:
        description: Also push :latest and the ECR image that Deploy rolls out
        type: boolean
        default: false
      release:
        description: Release tag (e.g. v5.1.1), published without the leading v
        type: string
        default: ""
    outputs:
      docker_sha:
        value: ${{ jobs.docker.outputs.docker_sha }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      docker_sha: ${{ steps.metadata.outputs.docker_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout agent skills
        uses: ./.github/actions/checkout-agent-skills

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Required to pull the hardened base image (FROM dhi.io/...) in the Dockerfile.
      # Depot forwards these credentials to its remote builder.
      - name: Login to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Configure AWS credentials for ECR
        if: inputs.deploy
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: inputs.deploy
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Depot CLI
        uses: depot/setup-action@v1

      - name: Prepare build metadata
        id: metadata
        env:
          DEPLOY: ${{ inputs.deploy }}
          RELEASE: ${{ inputs.release }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Store current git hash and date in files
          SHA=$(git rev-parse HEAD)
          mkdir -p buildinfo
          echo "${SHA}" > buildinfo/SHA
          printf '%(%Y-%m-%dT%H:%M:%SZ)T' > buildinfo/DATE
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "docker_sha=${SHA::7}" >> "$GITHUB_OUTPUT"

          # No ECR :latest — the ECR repo is immutable, so we push only the
          # unique git-<sha> tag. Docker Hub :latest stays for self-host.
          TAGS="growthbook/growthbook:git-${SHA::7}"
          if [ "$DEPLOY" = "true" ]; then
            TAGS="$TAGS"$'\n'"growthbook/growthbook:latest"$'\n'"${ECR_REGISTRY}/growthbook:git-${SHA::7}"
          fi
          # A release rebuilds its commit, so it publishes only the version tag rather than replace that commit's git-<sha> image.
          if [ -n "$RELEASE" ]; then
            TAGS="growthbook/growthbook:${RELEASE#v}"
          fi
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      # Registry round trips drop often enough to redden Deploy: one soft
      # attempt, then a blocking retry.
      - name: Build, tag, and push image
        id: build
        uses: depot/build-push-action@v1
        continue-on-error: true
        with:
          push: true
          context: .
          project: vmp2ssvj9r
          build-args: |
            DD_GIT_COMMIT_SHA=${{ steps.metadata.outputs.sha }}
            DD_GIT_REPOSITORY_URL=https://github.com/growthbook/growthbook.git
            DD_VERSION=${{ steps.metadata.outputs.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          platforms: linux/amd64,linux/arm64

      - name: Retry build, tag, and push image
        if: steps.build.outcome == 'failure'
        uses: depot/build-push-action@v1
        with:
          push: true
          context: .
          project: vmp2ssvj9r
          build-args: |
            DD_GIT_COMMIT_SHA=${{ steps.metadata.outputs.sha }}
            DD_GIT_REPOSITORY_URL=https://github.com/growthbook/growthbook.git
            DD_VERSION=${{ steps.metadata.outputs.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          platforms: linux/amd64,linux/arm64
