name: Backport

# Opens a PR into release/<line> with only the given main commits, for a patch release like 5.1.1.
# Merge it, then publish the draft release it creates; that tags the merge commit and Release builds it.
on:
  workflow_dispatch:
    inputs:
      line:
        description: Release line to patch, e.g. 5.1
        required: true
      commits:
        description: PR numbers or main commit SHAs to cherry-pick, space-separated, oldest first
        required: true
      security:
        description: Mark the draft release as a security patch release
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'growthbook/growthbook' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Picks up whichever pnpm the release branch's packageManager pins.
      - name: Enable corepack
        run: corepack enable

      - name: Cherry-pick onto the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ inputs.line }}
          COMMITS: ${{ inputs.commits }}
          BRANCH: backport/${{ inputs.line }}-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          # Run a copy: the script checks out the release branch, which may not have it.
          cp .github/scripts/backport.sh "$RUNNER_TEMP/backport.sh"
          # shellcheck disable=SC2086 # COMMITS is a list of words
          bash "$RUNNER_TEMP/backport.sh" "$LINE" "$BRANCH" "$GITHUB_SHA" $COMMITS
          git push origin "release/$LINE" "$BRANCH"

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ inputs.line }}
          COMMITS: ${{ inputs.commits }}
          BRANCH: backport/${{ inputs.line }}-${{ github.run_id }}
        run: |
          {
            echo "### Features and Changes"
            echo
            echo "Backports these commits from main onto \`release/$LINE\`:"
            echo
            git log --reverse --format='- %s' "origin/release/$LINE..$BRANCH"
            echo
            echo "Opened by GitHub Actions, so CI doesn't start on its own: close and reopen this PR to run it."
            echo
            echo "### Self-hosted build impact"
            echo
            echo "See the backported PRs above."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "release/$LINE" --head "$BRANCH" \
            --title "Backport to $LINE: $COMMITS" --body-file "$RUNNER_TEMP/body.md"

      # Publishing a draft tags its target branch's head then, so it must wait for the PR to merge.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ inputs.line }}
          SECURITY: ${{ inputs.security }}
          BRANCH: backport/${{ inputs.line }}-${{ github.run_id }}
        run: |
          tag=$(git tag --list "v$LINE.*" --sort=-v:refname | head -n1)
          next="v$LINE.$((${tag##*.} + 1))"
          picks=$(git log --reverse --grep='^(cherry picked from' --format='- %s' "origin/release/$LINE..$BRANCH")
          if gh release view "$next" >/dev/null 2>&1; then
            # Another backport is waiting on the same draft; add to it.
            { gh release view "$next" --json body --jq .body; echo "$picks"; } > "$RUNNER_TEMP/notes.md"
            gh release edit "$next" --notes-file "$RUNNER_TEMP/notes.md"
          else
            {
              echo "<!-- Publish only after the backport PRs into release/$LINE merge: publishing tags its head. -->"
              if [ "$SECURITY" = true ]; then echo "## Security Patch Release"; echo; fi
              echo "$picks"
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$next" --draft --latest=false --target "release/$LINE" \
              --title "$next" --notes-file "$RUNNER_TEMP/notes.md"
          fi
