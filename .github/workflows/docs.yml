name: Docs
on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check-docs-frontmatter.mjs"
      - "scripts/check-doclink-registry.mjs"
      - "packages/front-end/components/docSections.ts"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "scripts/check-docs-frontmatter.mjs"
      - "scripts/check-doclink-registry.mjs"
      - "packages/front-end/components/docSections.ts"
      - ".github/workflows/docs.yml"
# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  # Mintlify hosts/deploys docs via their GitHub App; this job only validates content.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Root package.json declares pnpm; this job only needs npm for the Mintlify CLI.
          package-manager-cache: false

      - name: Check YAML frontmatter quoting
        run: node scripts/check-docs-frontmatter.mjs

      - name: Install Mintlify CLI
        # Pinned: mint publishes ~daily and a partial publish breaks `latest`.
        run: npm install -g mint@4.2.910

      - name: Validate docs build
        working-directory: docs
        run: mint validate

      - name: Check for broken links
        working-directory: docs
        run: mint broken-links --check-anchors --check-redirects

      - name: Check DocLink registry targets
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-doclink-registry.mjs
