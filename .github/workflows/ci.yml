name: CI
on:
  push:
    branches: [main]
  pull_request:

# One workflow, always triggered, so exactly one check named `ci` is ever
# reported for a commit.
#
# Splitting code / no-code across two workflows could not be made mutually
# exclusive: `paths` fires when ANY changed file matches and `paths-ignore`
# fires when ANY changed file does not, so a PR touching both kinds triggered
# both. Both defined a job named `ci`, and the cheap one reported that check
# green while the real jobs were still running. The `changes` job below decides
# what to run instead, and `ci` at the bottom is the single required check.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect whether any code paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || files=""
          else
            files=$(gh api --paginate "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[]?.filename') || files=""
          fi

          # Failing to resolve the diff must never silently skip the test suite.
          if [ -z "$files" ]; then
            echo "Could not determine changed files; running every job."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"
          if echo "$files" | grep -qE '^(packages/|eslint-rules/|\.github/(workflows/ci\.yml|actions/)|pnpm-lock\.yaml$|package\.json$|eslint\.config\.mjs$|eslint-suppressions\.json$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every commit, code or not — this is what the old ci-nochanges
  # workflow existed to provide.
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace
        with:
          build-deps: "false"

      - name: Check formatting
        run: pnpm pretty:check

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # No eslint cache here on purpose. ESLint keys its cache on file content
      # plus the serialized config, neither of which changes when a type in
      # another package or a rule under eslint-rules/ changes. Caching would let
      # type-aware rules such as switch-exhaustiveness-check pass on stale results.
      - uses: ./.github/actions/setup-workspace

      - name: Lint
        run: pnpm lint:ci
        env:
          CI: true

  # The Python engine's lint and pytest suite. Split out so the JS jobs don't
  # pay for a Python toolchain they never use.
  stats:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: "pip"
          cache-dependency-path: "packages/stats/requirements.txt"

      - name: Install python dependencies
        run: |
          pip install pipx
          pipx install poetry
          poetry config virtualenvs.in-project true
        env:
          CI: true

      - name: Cache poetry dependencies
        uses: actions/cache@v5
        id: poetry-cache
        with:
          path: packages/stats/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('packages/stats/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install

      # `setup` and `test` are pnpm built-ins, so these need an explicit `run`.
      - name: Install stats engine
        run: pnpm --filter stats run setup
        env:
          CI: true

      - name: Lint
        run: pnpm --filter stats run lint:ci
        env:
          CI: true

      - name: Test
        run: pnpm --filter stats run test
        env:
          CI: true

  openapi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace

      - name: Check OpenAPI spec
        run: |
          pnpm generate-openapi
          [[ -n $(git status --porcelain) ]] && echo "You need to run pnpm generate-openapi" && git status --porcelain && exit 1 || true

  type-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace

      - name: Generate Next.js types
        run: pnpm --filter front-end exec next typegen

      - name: Type-check
        run: pnpm type-check
        env:
          CI: true

  # The back-end suite is ~80% of all test time, and a 4-vCPU runner gives Jest
  # only 3 workers for 300+ files. Split it across runners instead.
  test-back-end:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace

      - name: Cache Jest transform cache
        uses: actions/cache@v5
        with:
          path: packages/back-end/.jest-cache
          key: ${{ runner.os }}-jest-back-end-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-jest-back-end-${{ matrix.shard }}-
            ${{ runner.os }}-jest-back-end-

      - name: Test
        run: pnpm --filter back-end test --shard=${{ matrix.shard }}/4
        env:
          CI: true

  test-packages:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace

      - name: Cache Jest transform cache
        uses: actions/cache@v5
        with:
          path: packages/shared/.jest-cache
          key: ${{ runner.os }}-jest-shared-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-jest-shared-

      # stats (pytest) runs in its own job; back-end is sharded above.
      - name: Test
        run: pnpm --filter '!back-end' --filter '!stats' -r --workspace-concurrency=1 run test
        env:
          CI: true

  # The one required status check. Green only when every job above either
  # succeeded or was deliberately skipped.
  ci:
    if: always()
    needs:
      [
        changes,
        format,
        lint,
        stats,
        openapi,
        type-check,
        test-back-end,
        test-packages,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "A required job did not succeed."
                exit 1
                ;;
            esac
          done
