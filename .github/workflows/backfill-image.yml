name: Backfill image

# Deploy keeps one queued run, so a commit merged mid-deploy can be cancelled before it builds.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]

jobs:
  # A run cancelled after its docker job already pushed needs no rebuild.
  check:
    if: ${{ github.repository == 'growthbook/growthbook' && github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      exists: ${{ steps.inspect.outputs.exists }}
    steps:
      - name: Check for existing image
        id: inspect
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if docker buildx imagetools inspect "growthbook/growthbook:git-${SHA::7}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: [check]
    if: ${{ needs.check.outputs.exists != 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
