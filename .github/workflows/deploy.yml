name: Deploy

# After CI passes on main. A workflow_run run isn't a check on the commit, so a
# failed deploy doesn't mark the commit red; notify-on-failure still alerts Slack.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Read-only token by default; a job that needs more declares it itself.
permissions:
  contents: read

jobs:
  # workflow_run has no `paths` filter, so apply it here. Diffing from the last
  # successful Deploy (not the parent commit) means a deployable commit whose
  # queued run was superseded still ships with the next one.
  changes:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.repository == 'growthbook/growthbook'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Check for deployable changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          BASE=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable last-deployed commit; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$SHA" -- \
            .github/workflows/deploy.yml .github/workflows/build-image.yml \
            packages ':(exclude,glob)**/*.md' pnpm-lock.yaml Dockerfile .dockerignore)
          echo "Deployable changes since ${BASE::7}:"
          echo "${CHANGED:-(none)}"
          if [ -n "$CHANGED" ]; then echo "deploy=true"; else echo "deploy=false"; fi >> "$GITHUB_OUTPUT"

  # Build and publish the commit to docker
  docker:
    needs: [changes]
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      latest: true
    secrets: inherit

  # Extract front-end static assets to S3 and publish Sentry releases. This runs
  # before the services go live (deploy needs it) so the new app's content-hashed
  # assets are already served when the new revision starts handling requests.
  assets:
    runs-on: ubuntu-latest
    needs: [docker]
    if: ${{ github.repository == 'growthbook/growthbook' }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configure AWS credentials for GrowthBook Cloud
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Extract static assets from Docker image and upload to S3
        env:
          IMAGE: ${{ steps.login-ecr-prod.outputs.registry }}/growthbook:git-${{ needs.docker.outputs.docker_sha }}
        run: |
          docker pull ${IMAGE}
          docker create --name temp-container ${IMAGE}
          docker cp temp-container:/usr/local/src/app/packages/front-end/.next/static ./static
          # Back-end-dist and front-end-dist is for the sentry source maps task below.
          docker cp temp-container:/usr/local/src/app/packages/back-end/dist ./back-end-dist
          # Copy only server/ and static/ to front-end-dist as symlinks in .next/node_modules break docker cp
          mkdir -p front-end-dist
          cp -r ./static ./front-end-dist/static
          docker cp temp-container:/usr/local/src/app/packages/front-end/.next/server ./front-end-dist/server
          docker rm temp-container
          aws s3 sync ./static s3://growthbook-cloud-static-files/_next/static

      # Sentry's API drops the occasional connection: one soft attempt, then a
      # blocking retry. Silently skipping would cost source maps and commits.
      - name: Create Sentry api release
        id: sentry_api
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        continue-on-error: true
        with:
          environment: "production"
          sourcemaps: "./back-end-dist"
          release: ${{ github.event.workflow_run.head_sha }}
          inject: false
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: growthbook
          SENTRY_PROJECT: api

      - name: Retry Sentry api release
        if: steps.sentry_api.outcome == 'failure'
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        with:
          environment: "production"
          sourcemaps: "./back-end-dist"
          release: ${{ github.event.workflow_run.head_sha }}
          inject: false
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: growthbook
          SENTRY_PROJECT: api

      - name: Create Sentry app release
        id: sentry_app
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        continue-on-error: true
        with:
          environment: "production"
          sourcemaps: "./front-end-dist"
          release: ${{ github.event.workflow_run.head_sha }}
          inject: false
          url_prefix: "app:///_next"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: growthbook
          SENTRY_PROJECT: app

      - name: Retry Sentry app release
        if: steps.sentry_app.outcome == 'failure'
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        with:
          environment: "production"
          sourcemaps: "./front-end-dist"
          release: ${{ github.event.workflow_run.head_sha }}
          inject: false
          url_prefix: "app:///_next"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: growthbook
          SENTRY_PROJECT: app

  # Roll each service to the git-<sha> image we just built. The three services
  # deploy in parallel (matrix) rather than sequentially. Each step registers a
  # new task-definition revision (based on the current one, so env/secrets
  # defined in Terraform carry over) and rolls the service to it.
  deploy:
    runs-on: ubuntu-latest
    needs: [docker, assets]
    if: ${{ github.repository == 'growthbook/growthbook' }}
    strategy:
      # Don't cancel a healthy service's rollout because another service failed.
      fail-fast: false
      matrix:
        include:
          - { service: prod-api, container: api }
          - { service: prod-api-jobs, container: api-jobs }
          - { service: prod-api-python, container: api-python }
    steps:
      - name: Configure AWS credentials for GrowthBook Cloud
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Render task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ matrix.service }}
          container-name: ${{ matrix.container }}
          image: ${{ steps.login-ecr-prod.outputs.registry }}/growthbook:git-${{ needs.docker.outputs.docker_sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ matrix.service }}
          wait-for-service-stability: true
          # Backstop so a slow (but succeeding) rollout doesn't false-fail the
          # step before ECS finishes. Root fix is the health-check grace period.
          wait-for-minutes: 30
