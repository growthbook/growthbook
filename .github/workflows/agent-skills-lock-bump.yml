name: Bump agent skills
on:
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUMP_BRANCH: bot/bump-agent-skills

jobs:
  bump:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compare the pinned commit with growthbook/skills main
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOCK=packages/back-end/agent-skills.lock.json
          REPOSITORY=$(node -p "require('./$LOCK').repository")
          CURRENT=$(node -p "require('./$LOCK').commit")
          LATEST=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          # "ahead" means main is ahead of the pin. A pin that is off main is
          # left alone while an open skills PR still carries it (pinned on
          # purpose ahead of a merge). growthbook/skills squash-merges, so once
          # that PR merges its commit stays off main and the pin moves to main.
          STATUS=$(gh api "repos/$REPOSITORY/compare/$CURRENT...$LATEST" --jq .status)
          if [ "$STATUS" = "identical" ]; then
            echo "Agent skills are up to date at $CURRENT."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" != "ahead" ]; then
            OPEN=$(gh api "repos/$REPOSITORY/commits/$CURRENT/pulls" --jq '[.[] | select(.state == "open")] | length')
            if [ "$OPEN" != "0" ]; then
              echo "Pin $CURRENT is $STATUS relative to main and still on an open PR; leaving it."
              exit 0
            fi
            echo "Pin $CURRENT is $STATUS relative to main and no open PR carries it; moving to main."
          fi
          node -e '
            const fs = require("fs");
            const [file, commit] = process.argv.slice(1);
            const lock = JSON.parse(fs.readFileSync(file, "utf8"));
            fs.writeFileSync(file, JSON.stringify({ ...lock, commit }, null, 2) + "\n");
          ' "$LOCK" "$LATEST"
          # Commit subjects end in "(#N)", which would link to this repo.
          {
            echo "Bumps \`$LOCK\` to the latest [$REPOSITORY](https://github.com/$REPOSITORY) \`main\`, so the in-app assistant ships the current skills."
            echo
            echo "[Compare ${CURRENT:0:7}...${LATEST:0:7}](https://github.com/$REPOSITORY/compare/$CURRENT...$LATEST)"
            echo
            gh api "repos/$REPOSITORY/compare/$CURRENT...$LATEST" \
              --jq '.commits[] | [.sha[0:7], (.commit.message | split("\n")[0])] | @tsv' |
              while IFS=$'\t' read -r sha subject; do
                echo "- ${subject//(#/($REPOSITORY#} ($sha)"
              done
          } > "$RUNNER_TEMP/pr-body.md"
          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Close a stale bump PR
        if: steps.compare.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_SKILLS_BUMP_TOKEN || github.token }}
        run: |
          if gh pr view "$BUMP_BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr close "$BUMP_BRANCH" --delete-branch \
              --comment "Closing: \`agent-skills.lock.json\` already pins the latest growthbook/skills \`main\`."
          fi

      # PRs opened with the default token do not trigger CI. AGENT_SKILLS_BUMP_TOKEN
      # (optional) is a token with Contents and Pull requests write on this repo only.
      - name: Open or update the bump PR
        if: steps.compare.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.AGENT_SKILLS_BUMP_TOKEN || github.token }}
          branch: ${{ env.BUMP_BRANCH }}
          title: Bump agent skills
          commit-message: Bump agent skills
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: packages/back-end/agent-skills.lock.json
          delete-branch: true
