name: Notify on failure

on:
  workflow_run:
    workflows:
      [
        CI,
        Find feature flag code references,
        Deploy Branch to Docker Hub,
        Deploy,
        Docs,
        PR Preview Environment,
        Release,
        Rollback to SHA,
      ]
    types: [completed]
    branches: [main]

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  notify-not-success:
    runs-on: ubuntu-latest
    # SLACK_WEBHOOK_URL only exists in this repo, so forks would fail here.
    if: ${{ github.repository == 'growthbook/growthbook' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') }}
    steps:
      - name: Send GitHub Action data to a Slack workflow
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          payload-delimiter: "_"
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            workflow_name: "${{ github.event.workflow_run.name }}"
            workflow_url: "${{ github.event.workflow_run.html_url }}"
